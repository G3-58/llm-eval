category: chinese
name: 中文语言理解
description: 测试模型对中文语境、文化背景、语言细节的理解深度——面向中国市场产品的重要维度。

prompts:
  - id: c1
    name: 语境歧义理解
    prompt: |
      下面几个句子在中文日常语境中的"真实含义"是什么？请逐一解释，
      并说明这种表达方式体现了中文交际的什么特点：

      1. 领导说："这个方案你再想想。"
      2. 朋友说："你做的菜有自己的风格。"
      3. 同事说："你这个思路很大胆。"
      4. 甲方说："预算上我们再沟通沟通。"
    eval_criteria:
      - 正确识别每句话的"言外之意"（委婉否定/批评）
      - 分析有中文语用学视角，不只是字面翻译
      - 对"再想想""有自己的风格""很大胆""再沟通"的潜台词分析准确
      - 语言分析有一定深度，不流于表面

  - id: c2
    name: 古诗词理解与应用
    prompt: |
      "东边日出西边雨，道是无晴却有晴"出自刘禹锡《竹枝词》。

      请回答：
      1. 这句诗的字面意思和双关含义分别是什么？
      2. 现在有人用"道是无晴却有晴"来形容一个创业项目——他想表达什么？
      3. 如果你是一位产品经理，在什么工作情境下可以引用这句诗？给出一个具体场景。
    eval_criteria:
      - 字面意思解释准确（天气描述）
      - 双关含义解释正确（"晴"谐音"情"，暗写爱情若有若无）
      - 创业语境的解读合理（前景不明朗但实际有机会）
      - PM 应用场景具体、贴切，有创意

  - id: c3
    name: 中文写作风格辨析
    prompt: |
      请判断以下四段文字的写作风格，说明各自适合什么场景，
      并指出各段最明显的语言特征（各 50 字以内）：

      A：「本季度产品核心指标均超预期，DAU 突破 500 万，同比提升 67%，
         付费转化率从 2.3% 提升至 3.8%，NPS 评分达 78 分。」

      B：「五百万人，每天打开这个 App。不是因为没别的选择——是因为好用。
         这一年，我们做对了什么？」

      C：「亲爱的用户朋友们，感谢大家一路陪伴！我们的月活突破了 500 万！
         感动！继续加油！❤️」

      D：「Q3 DAU 5M（+67% YoY），付费率 3.8%（+1.5pp），NPS 78。
         核心驱动：留存优化+新功能拉新。下季度重点：转化漏斗优化。」
    eval_criteria:
      - 准确判断四种风格（数据报告/品牌叙事/用户运营/内部汇报）
      - 指出每段的核心语言特征，有具体依据
      - 场景判断合理，有实际经验感
      - 每段分析在 50 字以内
