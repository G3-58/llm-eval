category: instruction
name: 指令遵循
description: 测试模型在严格格式要求、字数约束、多条件并行下的遵循准确率——这是 AI 产品稳定性的核心指标。

prompts:
  - id: i1
    name: 严格格式输出
    prompt: |
      请对以下三款耳机做简短评价，必须严格按照下面的格式输出，不能有任何多余内容：

      产品：Sony WH-1000XM5
      产品：Apple AirPods Pro 2
      产品：Bose QuietComfort 45

      输出格式（每个产品一行，用"|"分隔，共3行）：
      产品名|优点(15字以内)|缺点(10字以内)|推荐指数(1-5的整数)
    eval_criteria:
      - 恰好输出 3 行，不多不少
      - 每行包含 4 个字段，用"|"分隔
      - 优点字数不超过 15 字
      - 缺点字数不超过 10 字
      - 推荐指数是 1-5 之间的整数
      - 没有额外的说明、前言或后记

  - id: i2
    name: 多约束写作
    prompt: |
      写一段产品介绍，同时满足以下所有条件：
      1. 总字数在 80-100 字之间（含标点）
      2. 必须包含数字"3"和"秒"这两个元素
      3. 第一句话必须是疑问句
      4. 不能使用"智能""革命""颠覆"这三个词
      5. 产品是一款 AI 会议记录工具
      6. 最后一句话必须包含"立即"二字
    eval_criteria:
      - 字数在 80-100 字之间
      - 包含数字"3"和"秒"
      - 第一句话是疑问句
      - 未使用"智能""革命""颠覆"
      - 内容关于 AI 会议记录工具
      - 最后一句包含"立即"

  - id: i3
    name: 结构化信息提取
    prompt: |
      从下面这段文字中提取信息，只输出 JSON，不要有任何其他内容：

      「张明，男，34岁，北京大学计算机系本科，清华大学软件工程硕士。现任某互联网公司
      高级产品经理，负责 AI 相关产品线，有 8 年产品经验。联系方式：zhangming@example.com，
      手机 138-0000-1234。擅长数据分析和用户研究，曾主导过日活百万级产品从 0 到 1 的搭建。」

      JSON 字段：name, gender, age, education(list), current_role, years_of_experience,
      email, phone, skills(list), highlight
    eval_criteria:
      - 输出是合法的 JSON，可以被 json.loads() 解析
      - 没有 JSON 以外的任何内容（无代码块标记、无说明文字）
      - 所有字段都存在
      - education 和 skills 是列表类型
      - 信息提取准确，无遗漏或错误
