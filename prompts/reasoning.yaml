category: reasoning
name: 推理能力
description: 测试模型在逻辑推理、数学应用和商业情境判断中的准确性与思维质量。

prompts:
  - id: r1
    name: 逻辑推理
    prompt: |
      有 5 位产品经理参加晋升评审，评委给出如下信息：
      1. 小王晋升，当且仅当小李也晋升
      2. 小张和小刘不能同时晋升
      3. 如果小陈晋升，则小张一定晋升
      4. 小李和小陈至少有一人晋升
      5. 小刘一定晋升

      请问：谁会晋升，谁不会？请给出完整的推导过程。
    answer_key:
      晋升: [小王, 小李, 小陈, 小刘]
      不晋升: [小张]
      推导关键步骤:
        - 由条件5：小刘晋升
        - 由条件2+5：小张不晋升（因为小刘晋升，所以小张不能晋升）
        - 由条件3逆否：小张不晋升 → 小陈不一定，但由条件4：小李或小陈至少一人晋升
        - 实际上条件3是"如果小陈晋升则小张晋升"，小张不晋升 → 小陈不晋升（逆否）
        - 由条件4：小李晋升
        - 由条件1：小王晋升
    eval_criteria:
      - 最终结论正确（小王小李小刘晋升，小张小陈不晋升）
      - 推导过程有逻辑，步骤清晰
      - 正确使用逆否命题（条件3）
      - 没有跳步或遗漏条件

  - id: r2
    name: 商业数学应用
    prompt: |
      某 AI 工具产品的定价和数据如下：
      - 免费版：0元/月，DAU 8万，人均使用 3 次/天
      - 专业版：99元/月，付费用户 6000人，人均使用 12 次/天
      - 转化漏斗：免费用户中有 5% 看到升级弹窗，看到弹窗的用户有 15% 最终付费

      问题：
      1. 当前月收入是多少？
      2. 如果将弹窗展示率从 5% 提升到 8%，预计增加多少月收入？（假设付费转化率不变）
      3. 如果要在不改变弹窗策略的情况下，将月收入提升 50%，专业版价格需要涨到多少？
    eval_criteria:
      - 第1题计算正确（6000×99=594000元）
      - 第2题计算正确（8万×3%×15%×99=35640元增量，约3.56万）
      - 第3题计算正确（594000×1.5/6000=148.5元）
      - 计算过程清晰，有中间步骤

  - id: r3
    name: 商业情境判断
    prompt: |
      你是一家 AI 写作助手产品的 PM。产品数据：月活 50 万，付费率 3%，ARPU 80元/月。
      你有以下 3 个方案可以选择，资源只够做一个：

      A. 优化核心写作功能（预计提升留存率 8%，不影响付费率）
      B. 新增 AI 配图功能（预计带来 15% 新用户增长，付费率可能下降 0.5%）
      C. 推出团队版套餐（定价 500元/月/5人，预计获得 2000 个团队客户，
         但需要大量客服资源，对个人版无影响）

      请给出你的选择和完整的决策分析，需要包含量化估算。
    eval_criteria:
      - 对三个方案都做了量化估算（不只是定性描述）
      - 有明确的选择结论，不模棱两可
      - 分析中考虑到资源约束和风险
      - 推理逻辑自洽，结论与分析一致
      - 有产品/商业视角的判断（不只是算数学题）
