category: writing
name: 写作能力
description: 测试模型在真实商业写作场景中的表现，关注专业度、格式规范和实用性。

prompts:
  - id: w1
    name: 商业道歉邮件
    prompt: |
      帮我写一封给客户的道歉邮件。背景：我们的 SaaS 产品昨晚发生故障，导致客户无法访问系统约 4 小时，
      影响了他们的业务运营。客户是一家中型电商企业，已合作 2 年，属于重要客户。
      邮件需要：专业、诚恳，承认责任，说明原因（服务器升级意外导致），提供一个月费用减免作为补偿，
      并承诺后续改进措施。
    eval_criteria:
      - 态度诚恳，明确承认责任，无推卸
      - 说明原因清晰，不过度技术化
      - 补偿方案具体（提到一个月减免）
      - 提出具体的改进承诺
      - 格式规范（称呼、正文结构、落款）
      - 语言专业流畅，无明显语病

  - id: w2
    name: 产品发布文案
    prompt: |
      为一款 AI 会议助手产品写一段微信公众号推文的开头（200字以内）。
      产品特点：实时转录会议内容、自动生成摘要和待办事项、支持多人发言识别、
      可导出到飞书/Notion。目标用户：企业中层管理者。
      要求：有吸引力，突出痛点，不要用"革命性""颠覆性"等过度营销词汇。
    eval_criteria:
      - 字数控制在 200 字以内
      - 明确点出目标用户的真实痛点
      - 至少提到 2 个产品核心功能
      - 没有"革命性""颠覆性"等过度词汇
      - 有一定吸引力，不流于平淡套话

  - id: w3
    name: 内容风格改写
    prompt: |
      将下面这段正式报告语言改写成适合在即刻/Twitter 发布的个人观点帖子风格（150字以内，
      可以分段用"/"分隔，语气可以主观、有个人判断）：

      原文：「根据最新市场调研数据显示，2024年中国 AI 大模型应用市场规模已达到 487 亿元人民币，
      同比增长率为 213%。其中，企业级应用场景占比最高，达到 61.3%，消费级应用占比 38.7%。
      预计至 2027年，市场规模将突破 3000 亿元。」
    eval_criteria:
      - 字数控制在 150 字以内
      - 语气转换成功，有个人观点/判断
      - 保留了核心数据（487亿、213%增长等）
      - 适合社交媒体传播，不像报告摘抄
      - 有一定观点或洞察，不只是转述数字
